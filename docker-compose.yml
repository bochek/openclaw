# Architecture Overview:
# - openclaw-gateway: Main OpenClaw gateway (includes built-in Control UI)
# - openclaw-cli: Management tool for OpenClaw

services:
  # ==========================================
  # OPENCLAW GATEWAY — Main Service
  # Integrates OpenRouter (cloud models) + External Ollama
  # ==========================================
  openclaw-gateway:
    image: openclaw:local
    container_name: openclaw-gateway
    ports:
      - "${GATEWAY_PORT:-18789}:18789"
    environment:
      - OPENCLAW_CONFIG_DIR=/root/.openclaw
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_IMAGE=openclaw:local
      - OPENCLAW_DOCKER_SOCKET=/var/run/docker.sock
      - OPENCLAW_TZ=UTC
      - OPENCLAW_DOCKER_APT_PACKAGES=${OPENCLAW_DOCKER_APT_PACKAGES:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-http://openclaw-admin-litellm:4000}
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - OPENCLAW_SANDBOX=off
      - NODE_OPTIONS=--dns-result-order=ipv4first
    user: root
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/root/.openclaw
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ./docker-cli:/usr/local/bin/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openclaw-net
      - admin-net
    restart: unless-stopped

  # ==========================================
  # OPENCLAW CLI — Management Interface
  # ==========================================
  openclaw-cli:
    image: openclaw:local
    container_name: openclaw-cli
    user: root
    entrypoint: ["node", "openclaw.mjs"]
    environment:
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENAI_API_BASE_URL=http://openclaw-admin-litellm:4000
      - OPENAI_API_KEY=${LITELLM_API_KEY}
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-cli:/usr/local/bin/docker:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - openclaw-net

  # ============ MCP SERVERS ============

  local-mcp:
    build:
      context: ./mcp/local-mcp
    container_name: local-mcp
    restart: unless-stopped
    ports:
      - "8005:8000"
    volumes:
      - ./mcp/local-mcp/chroma_db:/app/chroma_db
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openclaw-net

  mcp-docker:
    build:
      context: ./mcp
      dockerfile: Dockerfile.mcp
    container_name: mcp-docker
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--port", "8000", "--host", "0.0.0.0", "--", "docker-mcp-server"]
    networks:
      - openclaw-net

  mcp-docker-hub:
    build:
      context: ./mcp
      dockerfile: Dockerfile.mcp
    container_name: mcp-docker-hub
    restart: unless-stopped
    ports:
      - "8006:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--port", "8000", "--host", "0.0.0.0", "--", "docker", "run", "--rm", "-i", "mcp/dockerhub:latest"]
    networks:
      - openclaw-net

  mcp-desktop-commander:
    build:
      context: ./mcp
      dockerfile: Dockerfile.mcp
    container_name: mcp-desktop-commander
    restart: unless-stopped
    ports:
      - "8007:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--port", "8000", "--host", "0.0.0.0", "--", "docker", "run", "-i", "--rm", "-v", "C:\\Users\\Bochek:/local-directory", "mcp/desktop-commander"]
    networks:
      - openclaw-net

# ==========================================
# Infrastructure
# ==========================================
networks:
  openclaw-net:
    driver: bridge
    name: openclaw-net
  admin-net:
    external: true
