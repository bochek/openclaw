# Architecture Overview:
# - openclaw-gateway: Main OpenClaw gateway (includes built-in Control UI)
# - openclaw-cli: Management tool for OpenClaw

services:
  # ==========================================
  # OPENCLAW GATEWAY — Main Service
  # Integrates OpenRouter (cloud models) + External Ollama
  # ==========================================
  openclaw-gateway:
    image: openclaw:local
    container_name: openclaw-gateway
    ports:
      - "${GATEWAY_PORT:-18789}:18789"
    environment:
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_GATEWAY_BIND=0.0.0.0
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-f39778287f05cfb869dcd7867e648a8401985b028176532958ad68bca2c1c1b0}
      - OPENCLAW_IMAGE=openclaw:local
      - OPENCLAW_DOCKER_SOCKET=/var/run/docker.sock
      - OPENCLAW_TZ=UTC
      - OPENCLAW_DOCKER_APT_PACKAGES=${OPENCLAW_DOCKER_APT_PACKAGES:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-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}
      - OPENCLAW_SANDBOX=${OPENCLAW_SANDBOX:-require}
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - openclaw-net
    restart: unless-stopped

  # ==========================================
  # OPENCLAW CLI — Management Interface
  # ==========================================
  openclaw-cli:
    image: openclaw:local
    container_name: openclaw-cli
    entrypoint: ["node", "openclaw.mjs"]
    environment:
      - OPENCLAW_CONFIG_DIR=/home/node/.openclaw
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-f39778287f05cfb869dcd7867e648a8401985b028176532958ad68bca2c1c1b0}
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:18789
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - openclaw-net

# ==========================================
# Infrastructure
# ==========================================
networks:
  openclaw-net:
    driver: bridge
    name: openclaw-net
