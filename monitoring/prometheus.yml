global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # LiteLLM exposes Prometheus metrics at /metrics
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # NATS monitoring endpoint
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
